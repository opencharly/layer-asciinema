asciinema:
    candy:
        description: |
            Record and replay terminal sessions as asciicast v2 .cast files, and
            render them to animated GIFs with agg
            The asciinema candy installs the asciinema terminal recorder from the
            distro package (named `asciinema` on RPM, DEB, and PAC alike). It
            provides the /usr/bin/asciinema CLI whose `rec` subcommand captures a
            terminal session -- timing, input, and output -- into a replayable
            asciicast v2 .cast file; this is the engine behind the `record:` check
            verb's terminal mode (`record: start` with `record_mode: terminal`,
            served out-of-process by candy/plugin-record). It also installs the
            agg gif generator (asciinema/agg, pinned v1.9.0) as a prebuilt binary
            at /usr/local/bin/agg plus a monospace font (DejaVu Sans Mono) so a
            stopped .cast recording can be rendered to an animated GIF -- the
            engine behind the `record: gif` method. agg is NOT a distro package
            (absent from RPM/DEB/PAC repos), so the candy downloads the pinned
            prebuilt release binary; the font IS a distro package, resolved
            per-distro via package_map (dejavu-sans-mono-fonts / ttf-dejavu /
            fonts-dejavu-core).
        require:
            # plugin-record is the OUT-OF-TREE plugin that serves the `record:` check verb
            # (the asciinema/wf-recorder/pixelflux recording driver lives there, not in
            # charly's core check surface). asciinema PROVIDES the terminal recorder this verb
            # drives, so requiring plugin-record puts it in every composing image's scanned
            # candy set; the host's collectReferencedPluginWords then build-connects it before
            # a baked `record:` check dispatches — otherwise it SKIPs with `unknown verb
            # "record"`. (box/<distro> adopts the matching @github pin via reconcile later — the
            # deliberate cross-repo lag; the R10 bed loads the LOCAL candy via the superproject
            # override.)
            - '@github.com/opencharly/plugin-record/candy/plugin-record:v2026.272.0412'
        package:
            - asciinema
        distro:
            arch:
                package:
                    - ttf-dejavu
            debian,ubuntu:
                package:
                    - fonts-dejavu-core
            fedora:
                package:
                    - dejavu-sans-mono-fonts
        var:
            AGG_VERSION: v1.9.0
        plan:
            - run: download the agg gif generator binary and install it to /usr/local/bin
              download: "https://github.com/asciinema/agg/releases/download/${AGG_VERSION}/agg-${BUILD_ARCH}-unknown-linux-gnu"
              to: /usr/local/bin/agg
              mode: "0755"
              run_as: root
              # Explicit uninstall list so `charly deploy del` removes just the
              # binary this download drops in /usr/local/bin, not the whole shared
              # dir (which would wipe every system-local binary).
              uninstall:
                - /usr/local/bin/agg
            - check: the asciinema recorder binary is installed at /usr/bin/asciinema
              file:
                file: /usr/bin/asciinema
                exists: true
            - check: the asciinema package is registered in the distro package database
              package:
                package: asciinema
                installed: true
            - check: running asciinema --version prints the asciinema version banner and exits cleanly
              exit_status: 0
              stdout:
                - contains: asciinema
              command: /usr/bin/asciinema --version
            - check: asciinema --help advertises the rec subcommand that captures terminal sessions
              exit_status: 0
              stdout:
                - contains: rec
              command: /usr/bin/asciinema --help
            - check: the agg gif generator binary is installed at /usr/local/bin/agg
              file:
                file: /usr/local/bin/agg
                exists: true
            - check: agg reports its version and exits cleanly
              exit_status: 0
              stdout:
                - contains: agg
              command: /usr/local/bin/agg --version
            - check: agg converts a minimal asciicast to a gif (proving the binary and the monospace font work)
              exit_status: 0
              command: |
                printf '{"version": 2, "width": 20, "height": 5, "timestamp": 0}\n[0.0, "o", "hello\\n"]\n' > /tmp/charly-agg-check.cast && /usr/local/bin/agg /tmp/charly-agg-check.cast /tmp/charly-agg-check.gif && test -s /tmp/charly-agg-check.gif

asciinema-skill:
    skill:
        name: asciinema
        family: coder
        owner: asciinema
        description: |-
            Terminal session recorder (asciinema).
            Use when working with the asciinema candy.
